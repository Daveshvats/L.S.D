# =============================================================================
# L.S.D Security Pipeline - Supply Chain Security 2026
# =============================================================================
# This workflow implements comprehensive security scanning:
# - SAST (Static Application Security Testing)
# - Dependency vulnerability scanning
# - Secret detection
# - CodeQL analysis
# - SBOM generation
# =============================================================================

name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

# Least-privilege permissions
permissions:
  contents: read
  security-events: write
  actions: read

# Don't cancel security scans
concurrency:
  group: security-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.24.x'

jobs:
  # ===========================================================================
  # GOSEC - Static Application Security Testing
  # ===========================================================================
  gosec:
    name: Gosec SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b16316ce4f82b259767a7fb9d2f # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Gosec
        uses: securego/gosec@master
        with:
          args: |
            -no-fail=false
            -severity=medium
            -confidence=medium
            -exclude-generated
            -fmt=sarif
            -out=results.sarif
            ./...

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@fca7ace96b7d713c7035871441bd52efbe76e23d # v3.28.19
        if: always()
        with:
          sarif_file: results.sarif
          category: gosec

  # ===========================================================================
  # GOVULNCHECK - Go vulnerability check
  # ===========================================================================
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b16316ce4f82b259767a7fb9d2f # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          govulncheck -test ./... 2>&1 | tee vulncheck-output.txt
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ]; then
            echo "::error::Vulnerabilities found in dependencies"
            exit $exit_code
          fi

      - name: Upload vulncheck results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: vulncheck-results
          path: vulncheck-output.txt
          retention-days: 30

  # ===========================================================================
  # TRUFFLEHOG - Secret detection
  # ===========================================================================
  trufflehog:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b16316ce4f82b259767a7fb9d2f # v4.2.2
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified --fail

  # ===========================================================================
  # CODEQL - GitHub's CodeQL analysis
  # ===========================================================================
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b16316ce4f82b259767a7fb9d2f # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@fca7ace96b7d713c7035871441bd52efbe76e23d # v3.28.19
        with:
          languages: go
          queries: security-and-quality
          config-file: ./.github/codeql-config.yml
        continue-on-error: true

      - name: Autobuild
        uses: github/codeql-action/autobuild@fca7ace96b7d713c7035871441bd52efbe76e23d # v3.28.19

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@fca7ace96b7d713c7035871441bd52efbe76e23d # v3.28.19
        with:
          category: "/language:go"

  # ===========================================================================
  # SBOM - Software Bill of Materials
  # ===========================================================================
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [gosec, govulncheck]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b16316ce4f82b259767a7fb9d2f # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b $HOME/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Generate SBOM
        run: |
          syft . -o spdx-json=sbom-spdx.json
          syft . -o cyclonedx-json=sbom-cyclonedx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: |
            sbom-spdx.json
            sbom-cyclonedx.json
          retention-days: 90

      - name: SBOM summary
        run: |
          echo "## SBOM Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Formats: SPDX, CycloneDX" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Packages detected:" >> $GITHUB_STEP_SUMMARY
          jq '.packages | length' sbom-spdx.json >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # DEPENDENCY REVIEW - PR dependency changes
  # ===========================================================================
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b16316ce4f82b259767a7fb9d2f # v4.2.2

      - name: Dependency Review
        uses: actions/dependency-review-action@da245569545891d0ea836e62837839b9df018d8f # v4.7.1
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC
          deny-licenses: GPL-3.0, AGPL-3.0

  # ===========================================================================
  # SECURITY STATUS - Final security gate
  # ===========================================================================
  security-status:
    name: Security Status
    runs-on: ubuntu-latest
    needs: [gosec, govulncheck, trufflehog, codeql]
    if: always()
    steps:
      - name: Check security scan results
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Gosec | ${{ needs.gosec.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Govulncheck | ${{ needs.govulncheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TruffleHog | ${{ needs.trufflehog.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL | ${{ needs.codeql.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail on security issues
        run: |
          if [[ "${{ needs.gosec.result }}" == "failure" ]] || \
             [[ "${{ needs.govulncheck.result }}" == "failure" ]] || \
             [[ "${{ needs.trufflehog.result }}" == "failure" ]]; then
            echo "::error::Security vulnerabilities detected - see details above"
            exit 1
          fi
          echo "::notice::All security scans passed"

      - name: Create issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Security Scan Failed - ' + new Date().toISOString().split('T')[0],
              body: `
                ## Security Scan Failure
                
                One or more security scans have failed. Please investigate:
                
                - **Workflow Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                - **Branch**: ${{ github.ref }}
                - **Commit**: ${{ github.sha }}
                
                ### Failed Jobs
                - Gosec: ${{ needs.gosec.result }}
                - Govulncheck: ${{ needs.govulncheck.result }}
                - TruffleHog: ${{ needs.trufflehog.result }}
                - CodeQL: ${{ needs.codeql.result }}
                
                @${{ github.repository_owner }}/security
              `,
              labels: ['security', 'automated']
            })
